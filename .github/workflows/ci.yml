name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # redeploy the catalog by hand

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Validate catalog
        run: uv run scripts/build.py --check
      - name: Test the compiler
        run: uv run --with pyyaml==6.0.2 python -m unittest discover -s scripts -v

  # Publishes dist/index.json to GitHub Pages. Needs a public repository (or a paid plan).
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
